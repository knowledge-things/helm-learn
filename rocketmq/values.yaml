# Default values for rocketmq-proxy.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameserver:
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
    repository: "apache/rocketmq"
    tag: "latest"

  imagePullSecrets: [ ]
  nameOverride: "nameserver"
  fullnameOverride: ""

  port: 9876
  heapSize: "512M"

  serviceAccount:
    # Specifies whether a service account should be created
    create: false
    # Annotations to add to the service account
    annotations: { }
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  podAnnotations: { }
  nodeSelector: { }

  podSecurityContext:
    { }
  # fsGroup: 2000

  service:
    type: ClusterIP
    servicePort: 9876
    enableDraining: true
    drainTimeout: 30

  ingress:
    enabled: false
    className: ""
    annotations:
      { }
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: [ ]
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  persistence:
    enabled: false
    size: 8Gi

  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  configmap: |
    defaultThreadPoolNums=4


proxy:
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
    repository: "apache/rocketmq"
    tag: "latest"

  imagePullSecrets: [ ]
  nameOverride: "proxy"
  fullnameOverride: ""

  heapSize: "512M"
  maxDirectMemorySize: "256M"
  rocketMQClusterName: "DefaultCluster"

  config: { }

  serviceAccount:
    # Specifies whether a service account should be created
    create: false
    # Annotations to add to the service account
    annotations: { }
    # The name of the service account to use.
    # If not set and create is true, a name is generated using the fullname template
    name: ""

  podAnnotations:

  service:
    remotingInternetPort: 8080
    grpcPort: 8081
    adminPort: 8088
    internet:
      enabled: false
      acl:
        enabled: false
        id: ""
      configs:
        - id: ""

  ingress:
    enabled: false
    annotations: { }
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    hosts:
      - host: chart-example.local
        paths: [ ]
    tls: [ ]
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local

  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 500Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80

  nodeSelector: { }

  tolerations: [ ]

  affinity: { }


broker:
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
    repository: "apache/rocketmq"
    tag: "latest"

  partition: 0
  persistence:
    enabled: false
    size: 8Gi

  nameOverride: "broker"
  fullnameOverride: ""
  namesrvAddr: ""

  conf:
    clusterNameOverride: ""
    brokerNamePrefixOverride: ""
    tlsMode: disabled
    heapSize: "2G"
    enableStartupProbe: false
    startupProbeNamesrvAddr: ""
    nameServerHeadlessAddr: ""

  config: ""

  store:
    data:
      size: 10Gi
    log:
      size: 10Gi

  service:
    port: 10911

  jvmMemory: " -Xms1g -Xmx1g -Xmn512m -XX:MaxDirectMemorySize=2g "
  resources:
    limits:
      cpu: 1
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 2Gi

  nodeSelector: { }

  tolerations: [ ]

controller:
  nameOverride: "controller"
  fullnameOverride: ""
  replicas: 1
  image:
    registry: docker.io
    repository: "apache/rocketmq"
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 9878
    internalport: 9888
  resources:
    limits: 
      cpu: 1
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 500Mi
  readinessProbe:
    tcpSocket:
      port: 9878
    initialDelaySeconds: 5
    periodSeconds: 10
  livenessProbe:
    tcpSocket:
      port: 9878
    periodSeconds: 10
  startupProbe:
    tcpSocket:
      port: 9878
    failureThreshold: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
  config: ""
  persistence:
    enabled: false
    size: 20Gi


dashboard:
  enabled: true
  replicaCount: 1

  nameOverride: "dashboard"
  fullnameOverride: ""

  image:
    repository: "apacherocketmq/rocketmq-dashboard"
    tag: "2.1.0"
    pullPolicy: IfNotPresent

  containerPort: 8082

  auth:
    enabled: true
    users:
      - name: admin
        password: admin
        isAdmin: true
      # - name: user01
      #   password: userPass

  jvm:
    maxHeapSize: 600M

  resources:
    limits:
      cpu: 1
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 1Gi

  readinessProbe:
    failureThreshold: 6
    httpGet:
      path: /
      port: http
  livenessProbe: {}

  service:
    type: ClusterIP
    # nodePort: 31007

  ingress:
    enabled: false
    className: ""
    annotations: {}
      # nginx.ingress.kubernetes.io/whitelist-source-range: 10.0.0.0/8
    hosts:
      - host: rocketmq-dashboard.example.com
    tls: []
    #  - secretName: example-tls
    #    hosts:
    #      - rocketmq-dashboard.example.com

  nodeSelector: {}
