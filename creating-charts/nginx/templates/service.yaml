{{ if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
    name: {{ .Release.Name }}-{{ .Chart.Name }}-svc
    labels:
        app: {{ .Chart.Name }}
        release: {{ .Chart.Name }}
spec:
    type: {{ .Values.service.type }}
    selector:
        app: {{ .Chart.Name }}
        release: {{ .Chart.Name }}
    ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
          targetPort: {{ .Values.containerPorts.http }}
{{- end }}